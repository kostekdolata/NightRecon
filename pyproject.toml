[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nightrecon"
version = "0.31.0"
description = "A modular penetration testing and reconnaissance platform for authorized security assessments."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "NightRecon Project" }
]
dependencies = [
    "cryptography>=50.0.1,<51",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.63,<2",
]
api = [
    "PyYAML>=6.0,<7",
]
ssh = [
    "paramiko>=5.0,<6",
]
smb = [
    "impacket>=0.13.1,<0.14",
]
winrm = [
    "pywinrm>=0.5,<0.6",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
mysql = [
    "mysql-connector-python>=9.0,<10",
]
keywords = [
    "security",
    "pentesting",
    "reconnaissance",
    "cybersecurity"
]

[project.scripts]
nightrecon = "nightrecon.cli:main"
red-night = "nightrecon.red_night:main"

[tool.setuptools.packages.find]
include = ["nightrecon*"]
