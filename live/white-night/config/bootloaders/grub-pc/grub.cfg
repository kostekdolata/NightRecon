# White Night Live UEFI boot menu.
source /boot/grub/config.cfg

menuentry "White Night — Ephemeral Session" --hotkey=e {
    linux KERNEL_LIVE APPEND_LIVE nightrecon.live_mode=ephemeral
    initrd INITRD_LIVE
}

menuentry "White Night — Recovery & Integrity Check" --hotkey=r {
    linux KERNEL_LIVE APPEND_LIVE nightrecon.live_mode=recovery
    initrd INITRD_LIVE
}

menuentry "White Night — Secure Workspace" --hotkey=s {
    linux KERNEL_LIVE APPEND_LIVE nightrecon.live_mode=secure-workspace
    initrd INITRD_LIVE
}

submenu "Advanced options" {
    source /boot/grub/theme.cfg
    MEMTEST
}
