name: Create v0.14.0 Annotated Tag

on:
  push:
    branches:
      - v0.14.0-dev

permissions:
  contents: write

jobs:
  tag:
    name: Tag verified master release
    runs-on: ubuntu-latest

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create annotated v0.14.0 tag
        shell: bash
        env:
          TARGET_SHA: 4e63500bfa8f00dc91ff3d9e7f7a145287f3d87e
        run: |
          set -euo pipefail

          git cat-file -e "${TARGET_SHA}^{commit}"

          if git ls-remote --exit-code --tags origin refs/tags/v0.14.0 >/dev/null 2>&1; then
            echo "v0.14.0 already exists on origin; refusing to replace it."
            exit 1
          fi

          git config user.name "NightRecon Release"
          git config user.email "actions@users.noreply.github.com"

          git tag -a v0.14.0 "${TARGET_SHA}" \
            -m "NightRecon v0.14.0 Assessment Engine & Plugin Framework"

          git push origin refs/tags/v0.14.0
