name: Red Night Third-Party Import Validation
on:
  pull_request:
    paths:
      - 'packages/red-engine/nightrecon_red_engine/*import.py'
      - 'packages/red-engine/nightrecon_red_engine/metasploit_catalogue.py'
      - 'packages/red-engine/nightrecon_red_engine/evidence_correlation.py'
      - 'tests/test_nmap_import.py'
      - 'tests/test_pcap_import.py'
      - 'tests/test_metasploit_catalogue.py'
      - 'tests/test_evidence_correlation.py'
      - 'packages/red-engine/nightrecon_red_engine/zap_import.py'
      - 'packages/red-engine/nightrecon_red_engine/nuclei_import.py'
      - 'tests/test_zap_import.py'
      - 'tests/test_nuclei_import.py'
      - 'packages/red-engine/nightrecon_red_engine/nmap_scan_analysis.py'
      - 'tests/test_nmap_scan_analysis.py'
      - 'packages/red-engine/nightrecon_red_engine/tshark_import.py'
      - 'tests/test_tshark_import.py'
      - 'packages/red-engine/nightrecon_red_engine/web_har_import.py'
      - 'tests/test_web_har_import.py'
      - 'packages/red-engine/nightrecon_red_engine/vulnerability_triage.py'
      - 'tests/test_vulnerability_triage.py'
      - 'packages/red-engine/nightrecon_red_engine/identity_interop.py'
      - 'tests/test_identity_interop.py'
      - 'packages/red-engine/nightrecon_red_engine/pcapng_import.py'
      - 'tests/test_pcapng_import.py'
      - 'packages/red-engine/nightrecon_red_engine/finding_review_store.py'
      - 'tests/test_finding_review_store.py'
      - 'packages/red-engine/nightrecon_red_engine/identity_graph_export.py'
      - 'tests/test_identity_graph_export.py'
      - 'packages/red-engine/nightrecon_red_engine/web_har_analysis.py'
      - 'tests/test_web_har_analysis.py'
      - 'packages/red-engine/nightrecon_red_engine/tshark_diagnostics.py'
      - 'tests/test_tshark_diagnostics.py'
      - '.github/workflows/red-import-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install existing packages
        run: python -m pip install -e ./packages/shared-core -e ./packages/red-engine
      - name: Verify importers and regression tests
        run: |
          python -m unittest discover -s tests -p 'test_nmap_import.py' -v
          python -m unittest discover -s tests -p 'test_pcap_import.py' -v
          python -m unittest discover -s tests -p 'test_metasploit_catalogue.py' -v
          python -m unittest discover -s tests -p 'test_evidence_correlation.py' -v
          python -m unittest discover -s tests -p 'test_zap_import.py' -v
          python -m unittest discover -s tests -p 'test_nuclei_import.py' -v
          python -m unittest discover -s tests -p 'test_nmap_scan_analysis.py' -v
          python -m unittest discover -s tests -p 'test_tshark_import.py' -v
          python -m unittest discover -s tests -p 'test_web_har_import.py' -v
          python -m unittest discover -s tests -p 'test_vulnerability_triage.py' -v
          python -m unittest discover -s tests -p 'test_identity_interop.py' -v
          python -m unittest discover -s tests -p 'test_pcapng_import.py' -v
          python -m unittest discover -s tests -p 'test_finding_review_store.py' -v
          python -m unittest discover -s tests -p 'test_identity_graph_export.py' -v
          python -m unittest discover -s tests -p 'test_web_har_analysis.py' -v
          python -m unittest discover -s tests -p 'test_tshark_diagnostics.py' -v
