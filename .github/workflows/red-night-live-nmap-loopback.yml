name: Red Night Real Nmap Loopback Lab
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-nmap-loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine Nmap from Ubuntu package repositories
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap
          nmap --version
      - name: Install local Red Night libraries
        run: |
          python -m pip install -e ./packages/shared-core
          python -m pip install -e ./packages/red-engine
      - name: Scan isolated local HTTP listener and validate real Nmap XML
        env:
          RED_NIGHT_LIVE_NMAP_LOOPBACK: '1'
        run: python -m unittest discover -s tests -p 'test_live_nmap_loopback.py' -v
