name: Create v0.17.0 Annotated Tag

on:
  push:
    branches:
      - v0.17.0-dev

permissions:
  contents: write

jobs:
  tag:
    name: Tag verified master release
    runs-on: ubuntu-latest

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create annotated v0.17.0 tag
        shell: bash
        env:
          TARGET_SHA: e4b253c558ca28e71b5fb6740d82a1666def7bf4
        run: |
          set -euo pipefail

          git cat-file -e "${TARGET_SHA}^{commit}"

          if git ls-remote --exit-code --tags origin refs/tags/v0.17.0 >/dev/null 2>&1; then
            echo "v0.17.0 already exists on origin; refusing to replace it."
            exit 1
          fi

          git config user.name "NightRecon Release"
          git config user.email "actions@users.noreply.github.com"

          git tag -a v0.17.0 "${TARGET_SHA}" \
            -m "NightRecon v0.17.0 Host Discovery & Network Inventory"

          git push origin refs/tags/v0.17.0
