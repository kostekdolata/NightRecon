name: NightRecon CI

on:
  push:
    branches:
      - master
      - "v*-dev"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: nightrecon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools

      - name: Install NightRecon
        run: python -m pip install -e .

      - name: Run NightRecon tests
        run: python tests/run_tests.py
