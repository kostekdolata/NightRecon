name: NightRecon CI

on:
  push:
    branches:
      - master
      - "v*-dev"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: nightrecon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools

      - name: Install NightRecon
        run: python -m pip install -e .

      - name: Run NightRecon tests
        run: python tests/run_tests.py


  api-schema-integration:
    name: API YAML schema integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools

      - name: Install NightRecon API extra
        run: python -m pip install -e ".[api]"

      - name: Run YAML API schema integration tests
        run: python tests/api_schema_runtime.py


  ssh-runtime-integration:
    name: Paramiko SSH runtime compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools

      - name: Install NightRecon SSH extra
        run: python -m pip install -e ".[ssh]"

      - name: Run Paramiko SSH runtime compatibility
        run: python tests/ssh_paramiko_runtime.py


  smb-runtime-integration:
    name: Impacket SMB runtime compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools

      - name: Install NightRecon SMB extra
        run: python -m pip install -e ".[smb]"

      - name: Run Impacket SMB runtime compatibility
        run: python tests/smb_impacket_runtime.py


  winrm-runtime-integration:
    name: pywinrm runtime compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools

      - name: Install NightRecon WinRM extra
        run: python -m pip install -e ".[winrm]"

      - name: Run pywinrm runtime compatibility
        run: python tests/winrm_pywinrm_runtime.py


  browser-integration:
    name: Playwright Chromium loopback integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools

      - name: Install NightRecon browser extra
        run: python -m pip install -e ".[browser]"

      - name: Install Chromium runtime
        run: python -m playwright install --with-deps chromium

      - name: Run browser loopback integration tests
        run: python tests/browser_playwright_runtime.py
