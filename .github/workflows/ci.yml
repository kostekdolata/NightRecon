  red-live-luks2-integration:
    name: Red Night disposable LUKS2 executor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify Red persistence contracts and executor
        run: |
          python -m unittest \
            tests.test_red_live_persistence_contract \
            tests.test_red_live_persistence_executor -v

      - name: Install encrypted workspace test dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cryptsetup \
            e2fsprogs

      - name: Run disposable Red LUKS2 reboot and Ephemeral fixture
        run: |
          sudo python tests/red_live_luks_executor_runtime.py


  red-live-build-integration:
    name: Red Night Live UEFI boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade wheel build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Build Red package wheels
        shell: bash
        run: |
          mkdir -p live/red-night/.wheelhouse
          python -m pip wheel --no-deps \
            --wheel-dir live/red-night/.wheelhouse \
            ./packages/shared-core ./packages/red-engine ./packages/red-night

      - name: Verify Red Live deployment, appliance, and persistence contracts
        run: |
          python -m unittest \
            tests.test_red_live_build_skeleton \
            tests.test_red_live_appliance \
            tests.test_red_live_persistence_contract \
            tests.test_red_live_persistence_executor \
            tests.test_night_privilege_model -v

      - name: Install Debian 13 Live build and UEFI VM tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl cpio debootstrap debian-archive-keyring apt-utils bzip2 file rsync wget xz-utils \
            qemu-system-x86 ovmf xorriso squashfs-tools

          LIVE_BUILD_VERSION="20250505+deb13u1"
          LIVE_BUILD_DEB="$RUNNER_TEMP/live-build_${LIVE_BUILD_VERSION}_all.deb"
          LIVE_BUILD_SHA256="58e09779881cbcc631c49ceb703413e0247a87db01823e597b2a1c40a2afd8f4"

          curl -fsSL \
            "https://deb.debian.org/debian/pool/main/l/live-build/live-build_${LIVE_BUILD_VERSION}_all.deb" \
            -o "$LIVE_BUILD_DEB"
          echo "$LIVE_BUILD_SHA256  $LIVE_BUILD_DEB" | sha256sum -c -
          sudo dpkg -i "$LIVE_BUILD_DEB"

          test "$(dpkg-query -W -f='${Version}' live-build)" = "1:${LIVE_BUILD_VERSION}"
          lb --version

      - name: Build Red Night Live image
        shell: bash
        run: |
          sudo --preserve-env=GITHUB_SHA env \
            NIGHTRECON_SOURCE_REVISION="$GITHUB_SHA" \
            ./live/red-night/build-image.sh \
            --wheel-dir "$PWD/live/red-night/.wheelhouse" \
            --output "$RUNNER_TEMP/RedNight-Live-v0.44.0-dev-amd64.iso"

      - name: Verify Red Night Live release metadata
        shell: bash
        run: |
          export PYTHONPATH="$PWD/packages/red-night"
          export RED_LIVE_IMAGE="$RUNNER_TEMP/RedNight-Live-v0.44.0-dev-amd64.iso"
          python - <<'PY'
          import os
          from pathlib import Path
          from red_night_app.live_release import (
              RedLiveImageManifest,
              verify_live_image_manifest,
          )

          image = Path(os.environ["RED_LIVE_IMAGE"])
          manifest_path = Path(str(image) + ".manifest.json")
          package_manifest = Path(str(image) + ".package-manifest.json")
          sbom = Path(str(image) + ".SBOM.json")
          manifest = RedLiveImageManifest.from_json(
              manifest_path.read_text(encoding="utf-8")
          )
          assert manifest.source_revision == os.environ["GITHUB_SHA"]
          assert manifest.secure_boot_status == "not-verified"
          verify_live_image_manifest(
              manifest,
              image_path=image,
              package_manifest_path=package_manifest,
              sbom_path=sbom,
          )
          PY

      - name: Boot Red Night Live in UEFI VM
        shell: bash
        run: |
          ./live/red-night/ci/uefi_boot_smoke.sh \
            "$RUNNER_TEMP/RedNight-Live-v0.44.0-dev-amd64.iso"
