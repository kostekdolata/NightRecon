name: NightRecon CI

on:
  push:
    branches:
      - master
      - "v*-dev"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: nightrecon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools

      - name: Install NightRecon shared core
        run: python -m pip install -e ./packages/shared-core

      - name: Install NightRecon Red engine
        run: python -m pip install -e ./packages/red-engine

      - name: Install White Night engine
        run: python -m pip install -e ./packages/white-engine

      - name: Install White Night application
        run: python -m pip install -e ./packages/white-night

      - name: Install NightRecon
        run: python -m pip install -e .

      - name: Smoke test installed Red Night launcher
        run: python tests/red_night_package_smoke.py

      - name: Run NightRecon tests
        run: python tests/run_tests.py


  red-night-distribution:
    name: Red Night distribution on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
