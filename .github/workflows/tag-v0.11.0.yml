name: Create v0.11.0 Annotated Tag

on:
  push:
    branches:
      - v0.11.0-dev

permissions:
  contents: write

jobs:
  tag:
    name: Tag verified master release
    runs-on: ubuntu-latest

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create annotated v0.11.0 tag
        shell: bash
        env:
          TARGET_SHA: fbc0a86401c167c64e7e46b00a5759d7859b543c
        run: |
          set -euo pipefail

          git cat-file -e "${TARGET_SHA}^{commit}"

          if git ls-remote --exit-code --tags origin refs/tags/v0.11.0 >/dev/null 2>&1; then
            echo "v0.11.0 already exists on origin; refusing to replace it."
            exit 1
          fi

          git config user.name "NightRecon Release"
          git config user.email "actions@users.noreply.github.com"

          git tag -a v0.11.0 "${TARGET_SHA}" \
            -m "NightRecon v0.11.0 Vulnerability Intelligence"

          git push origin refs/tags/v0.11.0
