name: Red Night Concurrent Governed Tools Cloud Acceptance
# Manual end-of-integration-stage acceptance against only disposable lab data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-concurrent-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Nmap, TShark and NightRecon
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends nmap tshark
          python -m pip install -e ./packages/shared-core -e ./packages/red-engine
      - name: Start isolated HTTP target and create offline capture
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.11-alpine
          docker network create --internal rednight-concurrent-lab
          docker run -d --name rednight-concurrent-target \
            --network rednight-concurrent-lab \
            python:3.11-alpine python -m http.server 80 --bind 0.0.0.0
          ip="$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' rednight-concurrent-target)"
          test -n "$ip"
          echo "LAB_TARGET_IP=$ip" >> "$GITHUB_ENV"
          export LAB_TARGET_IP="$ip"
          export LAB_DIR="$RUNNER_TEMP/rednight-concurrent-lab"
          mkdir -p "$LAB_DIR"
          python - <<'PY'
          import os, struct, socket
          from pathlib import Path
          root=Path(os.environ["LAB_DIR"])
          eth=bytes.fromhex("aabbccddeeff1122334455660800")
          ip=(b"\x45\x00"+struct.pack("!H",40)+b"\x00\x00\x40\x00\x40\x06\x00\x00"
              +socket.inet_aton("192.0.2.1")+socket.inet_aton("192.0.2.2"))
          tcp=struct.pack("!HHIIHHHH",12345,443,0,0,0x5002,4096,0,0)
          packet=eth+ip+tcp
          pcap=struct.pack("<IHHIIII",0xa1b2c3d4,2,4,0,0,65535,1)
          pcap+=struct.pack("<IIII",0,0,len(packet),len(packet))+packet
          (root/"synthetic.pcap").write_bytes(pcap)
          PY
          for attempt in $(seq 1 30); do
            if python -c 'import os,socket; socket.create_connection((os.environ["LAB_TARGET_IP"],80),1).close()'; then exit 0; fi
            sleep 1
          done
          echo "Local disposable target unavailable" >&2
          exit 1
      - name: Register exact engagement and build fixed task plan
        shell: bash
        run: |
          set -euo pipefail
          export LAB_DIR="$RUNNER_TEMP/rednight-concurrent-lab"
          export NMAP_EXE="$(command -v nmap)"
          export TSHARK_EXE="$(command -v tshark)"
          python - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          from datetime import datetime,timedelta,timezone
          from nightrecon_red_engine.transactional_policy_authority import TransactionalPolicyAuthority
          from nightrecon_shared_core.engagement_policy import EngagementExecutionPolicy
          root=Path(os.environ["LAB_DIR"])
          now=datetime.now(timezone.utc)
          authority=TransactionalPolicyAuthority(root/"authority.db")
          authority.register(EngagementExecutionPolicy(
              engagement_id="disposable-concurrent-lab",
              scope=(os.environ["LAB_TARGET_IP"],"192.0.2.1"),
              valid_from=(now-timedelta(minutes=2)).isoformat(),
              valid_until=(now+timedelta(minutes=10)).isoformat(),
              max_actions=2,
              permitted_capabilities=("external.nmap.discovery","external.tshark.inspect"),
              max_impact="low",
          ),status="active")
          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          plan={"schema":1,"tasks":[
              {"kind":"nmap","engagement_id":"disposable-concurrent-lab",
               "action_id":"nmap-lab","target":os.environ["LAB_TARGET_IP"],
               "executable":os.environ["NMAP_EXE"],"trusted_sha256":sha(os.environ["NMAP_EXE"])},
              {"kind":"tshark","engagement_id":"disposable-concurrent-lab",
               "action_id":"tshark-lab","target":"192.0.2.1",
               "executable":os.environ["TSHARK_EXE"],"trusted_sha256":sha(os.environ["TSHARK_EXE"]),
               "capture_path":str(root/"synthetic.pcap"),"capture_root":str(root)},
          ]}
          (root/"plan.json").write_text(json.dumps(plan),encoding="utf-8")
          PY
      - name: Run simultaneous approved tool jobs with live JSONL feedback
        shell: bash
        run: |
          set -euo pipefail
          export LAB_DIR="$RUNNER_TEMP/rednight-concurrent-lab"
          python -c 'import sys; from nightrecon_red_engine.red_cli import main; main(tuple(sys.argv[1:]))' \
            governed-batch --plan "$LAB_DIR/plan.json" \
            --authority-db "$LAB_DIR/authority.db" \
            --audit-dir "$LAB_DIR" --max-workers 2 --execute \
            > "$LAB_DIR/task-events.jsonl"
          python - <<'PY'
          import os, json
          from pathlib import Path
          root=Path(os.environ["LAB_DIR"])
          rows=[json.loads(v) for v in (root/"task-events.jsonl").read_text().splitlines()]
          report=rows[-1]
          assert report["type"]=="batch-report"
          assert report["summary"]["succeeded"]==2, report
          assert report["execution_audit"]["status"]=="available", report["execution_audit"]
          audit_actions={a["action_id"]:a for a in report["execution_audit"]["actions"]}
          assert set(audit_actions)=={"nmap-lab","tshark-lab"}
          assert all(a["execution_status"]=="succeeded" for a in audit_actions.values())
          assert len(report["tasks"])==2
          by_tool={t["tool"]:t for t in report["tasks"]}
          assert by_tool["nmap"]["report"]["target"]==os.environ["LAB_TARGET_IP"]
          assert any(s["port"]==80 and s["state"]=="open" for s in
                     by_tool["nmap"]["report"]["services"])
          assert by_tool["tshark"]["report"]["packets_observed"]==1
          events=[r for r in rows if r["type"]=="task-event"]
          assert sum(e["status"]=="running" for e in events)==2
          audit=[json.loads(r) for r in (root/"execution.jsonl").read_text().splitlines()]
          assert {r["action_id"] for r in audit}=={"nmap-lab","tshark-lab"}
          assert sum(r["status"]=="completed" for r in audit)==2
          assert all("stdout" not in r and "stderr" not in r for r in audit)
          print("Concurrent real Nmap + TShark -> bounded report + audit: PASS")
          PY
      - name: Retain redacted operator events and audit metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rednight-concurrent-lab-evidence
          path: |
            ${{ runner.temp }}/rednight-concurrent-lab/task-events.jsonl
            ${{ runner.temp }}/rednight-concurrent-lab/execution.jsonl
          retention-days: 7
      - name: Always clean isolated lab and assessment files
        if: always()
        shell: bash
        run: |
          docker rm -f rednight-concurrent-target || true
          docker network rm rednight-concurrent-lab || true
          rm -rf "$RUNNER_TEMP/rednight-concurrent-lab"
