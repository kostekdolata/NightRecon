[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nightrecon-shared-core"
version = "0.36.0.dev0"
description = "Network-free shared safety and edition policy for NightRecon applications"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.packages.find]
include = ["nightrecon_shared_core*"]
