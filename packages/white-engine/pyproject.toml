[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nightrecon-white-engine"
version = "0.1.0a2"
description = "White Night engagement and exercise-control engine foundation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "nightrecon-shared-core==0.41.0",
]

[tool.setuptools.packages.find]
include = ["nightrecon_white_engine*"]
