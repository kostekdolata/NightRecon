[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nightrecon-red-engine"
version = "0.32.0.dev0"
description = "Red Night engine package for existing authorized NightRecon assessment capabilities"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "nightrecon-shared-core==0.32.0.dev0",
    "cryptography>=50.0.1,<51",
]

[tool.setuptools.packages.find]
include = ["nightrecon_red_engine*"]
