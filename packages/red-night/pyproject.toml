[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nightrecon-red-night"
version = "0.32.0.dev0"
description = "Red Night application launcher for authorized NightRecon assessment"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "nightrecon==0.31.0",
    "nightrecon-shared-core==0.32.0.dev0",
    "nightrecon-red-engine==0.32.0.dev0",
    "cryptography>=50.0.1,<51",
]

[project.optional-dependencies]
browser = ["playwright>=1.63,<2"]
api = ["PyYAML>=6.0,<7"]
ssh = ["paramiko>=5.0,<6"]
smb = ["impacket>=0.13.1,<0.14"]
winrm = ["pywinrm>=0.5,<0.6"]
postgres = ["psycopg[binary]>=3.2,<4"]
mysql = ["mysql-connector-python>=9.0,<10"]
all = [
    "playwright>=1.63,<2",
    "PyYAML>=6.0,<7",
    "paramiko>=5.0,<6",
    "impacket>=0.13.1,<0.14",
    "pywinrm>=0.5,<0.6",
    "psycopg[binary]>=3.2,<4",
    "mysql-connector-python>=9.0,<10",
]

[project.scripts]
red-night-app = "red_night_app:main"

[tool.setuptools.packages.find]
include = ["red_night_app*"]
